<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore Beautiful Moments</p>
    </header>

    <div class="filters">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('city')">City</button>
        <button onclick="filterImages('animals')">Animals</button>
    </div>

    <div class="gallery">

        <div class="gallery-item nature">
    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800" alt="Nature" onclick="openLightbox(0)">
</div>

<div class="gallery-item nature">
    <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800" alt="Nature" onclick="openLightbox(1)">
</div>

<div class="gallery-item city">
    <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800" alt="City" onclick="openLightbox(2)">
</div>

<div class="gallery-item city">
    <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800" alt="City" onclick="openLightbox(3)">
</div>

<div class="gallery-item animals">
    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800" alt="Dog" onclick="openLightbox(4)">
</div>

<div class="gallery-item animals">
    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800" alt="Dog" onclick="openLightbox(5)">
        </div>

    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="changeImage(-1)">&#10094;</button>

        <img id="lightbox-image" src="" alt="Large Image">

        <button class="next" onclick="changeImage(1)">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
